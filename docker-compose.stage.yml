# El stage entero: los siete servicios de un deploy de Dokploy (Project → Create Service →
# Compose). Corre como producción (ASPNETCORE_ENVIRONMENT=Production, codegen estático, resources
# sin auto-create): la única ficción son las personas sembradas y sus reseñas, y esa ficción es
# dato, no un modo distinto de correr la app. `migrate` y `seed` son servicios de un solo uso que
# dejan la base lista antes de que `api` arranque (ver ADR-0091); `seed` no existe en
# docker-compose.prod.yml, que es la protección fuerte contra sembrar producción.
# Dokploy inyecta (pestaña Environment): POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET,
# SESSION_SECRET, SMTP_FROM_EMAIL, SMTP_FROM_NAME, WEB_HOST, MAILPIT_UI_AUTH, PLANB_SEED_PASSWORD.
# PLANB_API_TAG y PLANB_WEB_TAG son opcionales: sin valor corren main (el tag móvil que publica
# cada push a main); un sha corto en esas variables pinea el stage a esa versión.
# El reset es `down -v` y volver a desplegar: `migrate` y `seed` vuelven a correr solos.
# Los mem_limit salen del consumo medido en reposo (api 362 MiB, web 94 MiB) con margen para
# carga y JIT; si un contenedor se pasa, Docker lo reinicia solo a él (restart: unless-stopped)
# y el resto sigue. `migrate` y `seed` no llevan mem_limit: corren una vez y terminan, no hay
# consumo sostenido que limitar. Los logs rotan con json-file para que no llenen el disco del VPS.
# `cpus` acota solo a los servicios de vida larga (`migrate` y `seed` corren una vez y terminan);
# el VPS tiene 2 vCPU (`k6/README.md`) y lo comparte con otros proyectos, así que cada valor queda
# bien por debajo de esas 2 para que ningún contenedor pueda solo saturar la máquina. `pids_limit`
# va en todos, `migrate` y `seed` incluidos: acota cuántos procesos/threads puede abrir cada uno,
# con margen de sobra sobre lo medido en reposo (`podman stats`, ver ADR-0092). Cada servicio corre
# sin privilegios nuevos, sin capacidades Linux salvo las puntuales que su propio entrypoint
# necesita, y con el filesystem de la imagen en solo lectura; lo que necesita escribir tiene su
# `tmpfs` o su volumen, nunca la imagen entera (ver ADR-0092 para el detalle por servicio).
# Producción es docker-compose.prod.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# security_opt y cap_drop son iguales en los nueve servicios: nadie gana privilegios nuevos y
# arranca sin capacidades Linux. read_only también es igual en los nueve: los tres que necesitan
# escribir algo lo hacen a un tmpfs o a un volumen declarado aparte, nunca a la imagen.
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true

services:
  postgres:
    image: pgvector/pgvector:pg17
    <<: *hardening
    # El entrypoint arranca como root para preparar /var/lib/postgresql/data y recién ahí baja a
    # postgres (gosu): sin estas cinco no arranca, verificado sacándolas una por una.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    tmpfs:
      - /var/run/postgresql
      - /tmp
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    logging: *logging
    environment:
      POSTGRES_USER: planb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planb
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - planb_stage_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planb -d planb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Estado efímero: un reinicio cierra sesiones y nada más, el reset del stage es down -v igual.
  redis:
    image: redis:7-alpine
    <<: *hardening
    # El entrypoint también arranca como root para chown-ear /data y bajar a redis (gosu): sin
    # SETUID falla con "setresuid failed", verificado.
    cap_add: ["CHOWN", "SETUID", "SETGID"]
    tmpfs:
      - /data
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 50
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.29
    <<: *hardening
    # Sin persistencia configurada (MP_DATABASE) guarda todo en memoria: no necesita capacidad
    # ni tmpfs, verificado.
    cap_add: []
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    logging: *logging
    expose: ["1025", "8025"]
    environment:
      # Mailpit muestra los links de verificación y de reset de todas las cuentas: la UI va con auth (usuario:password).
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
      - dokploy-network

  # Un solo uso: deja migradas las tres schemas de EF Core y aplicados los recursos de Wolverine
  # (el schema del outbox durable), y termina. `api` no arranca hasta que esto termine bien: en
  # Production nadie migra ni crea recursos solo (ver ADR-0091).
  migrate:
    image: ghcr.io/lucasidev/plan-b/planb-api:${PLANB_API_TAG:-main}
    <<: *hardening
    # Corre directo como el usuario "app" de la imagen (USER app en el Dockerfile): no baja
    # privilegios ni escribe nada en el filesystem, verificado.
    cap_add: []
    pull_policy: always
    command: ["migrate-db"]
    restart: "no"
    pids_limit: 100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Planb: Host=postgres;Port=5432;Database=planb;Username=planb;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
    networks:
      - internal

  # Un solo uso: siembra personas, catálogo académico, catálogo de frases y corpus de reseñas, y
  # termina. Es la única ficción del stage y por eso es la única diferencia real con
  # docker-compose.prod.yml, que no tiene este servicio (así producción no puede sembrar ni por
  # error de configuración).
  seed:
    image: ghcr.io/lucasidev/plan-b/planb-api:${PLANB_API_TAG:-main}
    <<: *hardening
    cap_add: []
    pull_policy: always
    command: ["seed-db"]
    restart: "no"
    pids_limit: 100
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PLANB_SEED_PASSWORD: ${PLANB_SEED_PASSWORD}
      ConnectionStrings__Planb: Host=postgres;Port=5432;Database=planb;Username=planb;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
    networks:
      - internal

  api:
    image: ghcr.io/lucasidev/plan-b/planb-api:${PLANB_API_TAG:-main}
    <<: *hardening
    cap_add: []
    pull_policy: always
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    logging: *logging
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Planb: Host=postgres;Port=5432;Database=planb;Username=planb;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__UseSsl: "false"
      Smtp__FromEmail: ${SMTP_FROM_EMAIL}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Identity__Verification__LinkBaseUrl: https://${WEB_HOST}/verify-email
      Identity__PasswordReset__LinkBaseUrl: https://${WEB_HOST}/reset-password
    # La imagen de aspnet no trae curl ni wget, pero sí bash: el pedido HTTP se arma a mano por el socket.
    # Healthy significa que /health responde 200, o sea que Postgres y Redis también contestan.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal

  web:
    image: ghcr.io/lucasidev/plan-b/planb-web:${PLANB_WEB_TAG:-main}
    <<: *hardening
    # Corre directo como el usuario "bun" de la imagen: no baja privilegios. El optimizador de
    # imágenes de Next escribe su caché en .next/cache en runtime, de ahí el tmpfs.
    cap_add: []
    tmpfs:
      - /app/.next/cache
    pull_policy: always
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *logging
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: planb
      JWT_AUDIENCE: planb
      SESSION_SECRET: ${SESSION_SECRET}
    # /health del web es el rewrite al api, así que healthy en web es toda la cadena.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - dokploy-network

# Traefik solo alcanza los servicios conectados a dokploy-network: por eso web y mailpit están
# ahí además de internal. postgres, redis y api se quedan solo en internal, sin dominio.
networks:
  internal:
  dokploy-network:
    external: true

volumes:
  planb_stage_postgres:
    name: planb_stage_postgres
