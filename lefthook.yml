# Los globs listan el nivel raíz aparte del anidado a propósito: `dir/**/*.ext`
# exige al menos un directorio intermedio, así que sin la primera línea de cada
# par un push que solo toca `Directory.Packages.props`, `global.json`,
# `package.json` o `tsconfig.json` no dispara ningún hook. Son justo los
# archivos donde un cambio tiene más alcance.

pre-commit:
  parallel: true
  commands:
    frontend-format:
      root: "frontend/"
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    scripts-format:
      # El binario que instala frontend, no `bunx biome`: desde la raíz no hay
      # package.json y `bunx biome` baja otro paquete de npm que se llama igual.
      glob:
        - "scripts/*.ts"
        - "scripts/**/*.ts"
      run: ./frontend/node_modules/.bin/biome check --write {staged_files}
      stage_fixed: true
    backend-format:
      # Solo `whitespace`. Los pases `style` y `analyzers` cuestan 21s extra y
      # no encuentran nada: el .editorconfig no declara ni una severidad, así
      # que las reglas IDE/CA quedan en `silent`, por debajo del umbral `warn`
      # que usan tanto el formatter como el build. Y si alguna vez se declaran
      # severidades, `EnforceCodeStyleInBuild` + `TreatWarningsAsErrors`
      # (Directory.Build.props) las vuelve error de compilación, o sea que
      # backend-build las frena en pre-push. El formato de whitespace es lo
      # único que ningún compilador mira.
      root: "backend/"
      glob: "*.cs"
      run: dotnet format whitespace --include {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commits:
      run: bun scripts/check-commit-msg.ts {1}

# La misma política que CI; conserva evidencia local por comando e inputs.
pre-push:
  commands:
    verify:
      run: bun scripts/verify.ts
