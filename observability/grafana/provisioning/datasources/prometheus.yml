# Datasource provisionado como código. El uid es fijo a propósito: el tablero y las
# alertas lo referencian por uid, no por el id numérico que Grafana asigna solo.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
