name: Release images

# Manual a propósito. ADR-0038 dice que pre-deploy no hay versiones ni releases automáticas: el
# que publica una imagen es alguien que decidió publicarla, no un merge a main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch o tag a publicar'
        required: true
        default: 'main'
      component:
        description: 'Qué publicar'
        required: true
        default: 'both'
        type: choice
        options: [both, backend, frontend]
      api_url:
        description: 'URL del backend que el frontend hornea en el build; interna al compose del stage'
        required: true
        default: 'http://api:8080'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend image
    if: inputs.component == 'both' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-api"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${sha},${image}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend image
    if: inputs.component == 'both' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-web"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${sha},${image}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NEXT_PUBLIC_API_URL=${{ inputs.api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Recordatorio en el log de la corrida, no un paso automático. Aplicar el schema desde un runner
  # de GitHub exigiría exponer la base de producción a internet; el paso corre en el host del deploy.
  # Runbook: docs/engineering/deploy.md
  reminder:
    name: Siguiente paso
    needs: [backend]
    if: always() && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Para el stage estos pasos no aplican: el api migra y siembra solo al arrancar (sección Stage de docs/engineering/deploy.md)."
          echo "Imagen publicada. Antes de levantar la versión nueva:"
          echo "  1. db-apply con la imagen recién publicada (migraciones EF + schema de Wolverine)"
          echo "  2. recién ahí, apuntar el servicio a la imagen nueva"
          echo "Pasos exactos en docs/engineering/deploy.md"
