name: Publish images

# Se publica en cada push a main porque el stage sigue a main, y también a mano para
# cualquier ref (la corrida manual). El tag del sha es el inmutable; el tag main es
# el móvil que consume el stage.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch o tag a publicar'
        required: true
        default: 'main'
      component:
        description: 'Qué publicar'
        required: true
        default: 'both'
        type: choice
        options: [both, backend, frontend]
      api_url:
        description: 'URL del backend que el frontend hornea en el build; interna al compose del stage'
        required: true
        default: 'http://api:8080'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend image
    if: github.event_name == 'push' || inputs.component == 'both' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-api"
          tags="${image}:${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tags="${tags},${image}:main"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend image
    if: github.event_name == 'push' || inputs.component == 'both' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse --short HEAD)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-web"
          tags="${image}:${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tags="${tags},${image}:main"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NEXT_PUBLIC_API_URL=${{ github.event_name == 'workflow_dispatch' && inputs.api_url || 'http://api:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stage:
    name: Redeploy the stage
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Va por la API de Dokploy, no por su Autodeploy: el Autodeploy dispara con el push
      # mismo, antes de que las imágenes existan en el registry.
      - env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_STAGE_COMPOSE_ID: ${{ secrets.DOKPLOY_STAGE_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_STAGE_COMPOSE_ID" ]; then
            echo "::notice::Las imágenes quedaron publicadas; el stage no se redespliega porque faltan los secrets de Dokploy."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "$DOKPLOY_URL/api/compose.deploy" -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" -d "{\"composeId\": \"$DOKPLOY_STAGE_COMPOSE_ID\"}"
          echo "El stage está redesplegando ${GITHUB_SHA:0:7}."

  # Recordatorio en el log de la corrida, no un paso automático. Aplicar el schema desde un runner
  # de GitHub exigiría exponer la base de producción a internet; el paso corre en el host del deploy.
  # Runbook: docs/engineering/deploy.md
  reminder:
    name: Siguiente paso
    needs: [backend]
    if: github.event_name == 'workflow_dispatch' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Para el stage estos pasos no aplican: el api migra y siembra solo al arrancar (sección Stage de docs/engineering/deploy.md)."
          echo "Imagen publicada. Antes de levantar la versión nueva:"
          echo "  1. db-apply con la imagen recién publicada (migraciones EF + schema de Wolverine)"
          echo "  2. recién ahí, apuntar el servicio a la imagen nueva"
          echo "Pasos exactos en docs/engineering/deploy.md"
