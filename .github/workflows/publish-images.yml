name: Publish images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/publish-images.yml'
      - 'scripts/deploy-coolify-services.ts'
      - 'scripts/lib/coolify-service.ts'
      - '.dockerignore'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch o tag a publicar'
        required: true
        default: 'main'
      operation:
        description: 'Solo publicar imágenes o también desplegar el target'
        required: true
        default: 'publish-only'
        type: choice
        options: [publish-only, publish-and-deploy]
      target:
        description: 'Target que define la imagen web y, si corresponde, el despliegue'
        required: true
        default: 'stage'
        type: choice
        options: [stage, production]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'release' && 'production' || github.event_name == 'workflow_dispatch' && inputs.target || 'stage' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve source and target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Resolve full SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          case "$EVENT_NAME" in
            push) target="stage" ;;
            release) target="production" ;;
            workflow_dispatch) target="$INPUT_TARGET" ;;
            *) echo "::error::Evento no soportado: $EVENT_NAME"; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Validate deployment destination before publishing
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'publish-and-deploy'
        env:
          TARGET: ${{ steps.target.outputs.target }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_STAGE_MIGRATE_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_MIGRATE_SERVICE_UUID }}
          COOLIFY_STAGE_API_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_API_SERVICE_UUID }}
          COOLIFY_STAGE_WEB_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_WEB_SERVICE_UUID }}
          COOLIFY_STAGE_MIGRATE_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_MIGRATE_SERVICE_NAME }}
          COOLIFY_STAGE_API_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_API_SERVICE_NAME }}
          COOLIFY_STAGE_WEB_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_WEB_SERVICE_NAME }}
          COOLIFY_STAGE_API_INTERNAL_URL: ${{ vars.COOLIFY_STAGE_API_INTERNAL_URL }}
          COOLIFY_PRODUCTION_MIGRATE_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_MIGRATE_SERVICE_UUID }}
          COOLIFY_PRODUCTION_API_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_API_SERVICE_UUID }}
          COOLIFY_PRODUCTION_WEB_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_WEB_SERVICE_UUID }}
          COOLIFY_PRODUCTION_MIGRATE_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_MIGRATE_SERVICE_NAME }}
          COOLIFY_PRODUCTION_API_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_API_SERVICE_NAME }}
          COOLIFY_PRODUCTION_WEB_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_WEB_SERVICE_NAME }}
          COOLIFY_PRODUCTION_API_INTERNAL_URL: ${{ vars.COOLIFY_PRODUCTION_API_INTERNAL_URL }}
          COOLIFY_PRODUCTION_HEALTH_URL: ${{ vars.COOLIFY_PRODUCTION_HEALTH_URL }}
          COOLIFY_PRODUCTION_WEB_URL: ${{ vars.COOLIFY_PRODUCTION_WEB_URL }}
        run: |
          required="COOLIFY_URL COOLIFY_API_TOKEN"
          for field in MIGRATE_SERVICE_UUID API_SERVICE_UUID WEB_SERVICE_UUID MIGRATE_SERVICE_NAME API_SERVICE_NAME WEB_SERVICE_NAME API_INTERNAL_URL; do
            required="$required COOLIFY_${TARGET^^}_${field}"
          done
          if [ "$TARGET" = production ]; then
            required="$required COOLIFY_PRODUCTION_HEALTH_URL COOLIFY_PRODUCTION_WEB_URL"
          fi
          for name in $required; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required configuration: $name"
              exit 1
            fi
          done

  ci-gate:
    name: Require green CI before deploy
    needs: [resolve]
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-and-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI run of this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          for _ in $(seq 1 120); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event push \
              --commit "$RESOLVED_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
              exit 0
            fi

            sleep 5
          done

          echo "::error::No apareció una corrida de CI para $RESOLVED_SHA."
          exit 1

  backend:
    name: Backend image
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image_ref }}@${{ steps.push.outputs.digest }}
      sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Resolve image
        id: meta
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-api"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image}:${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.title=planb-api
            org.opencontainers.image.description=API de planb, instrumento de presión estudiantil sobre universidades argentinas
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: GIT_SHA=${{ needs.resolve.outputs.sha }}
          provenance: true
          sbom: true
          # Cada imagen conserva su caché; el scope default compartido se sobrescribe.
          cache-from: type=gha,scope=planb-api
          cache-to: type=gha,scope=planb-api,mode=max

  frontend:
    name: Frontend image
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      STAGE_INTERNAL_API_URL: ${{ vars.COOLIFY_STAGE_API_INTERNAL_URL }}
      PRODUCTION_INTERNAL_API_URL: ${{ vars.COOLIFY_PRODUCTION_API_INTERNAL_URL }}
      INTERNAL_API_URL: ${{ needs.resolve.outputs.target == 'stage' && vars.COOLIFY_STAGE_API_INTERNAL_URL || vars.COOLIFY_PRODUCTION_API_INTERNAL_URL }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image_ref }}@${{ steps.push.outputs.digest }}
      sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Validate target configuration
        env:
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          case "$TARGET" in
            stage) required_url="$STAGE_INTERNAL_API_URL" ;;
            production) required_url="$PRODUCTION_INTERNAL_API_URL" ;;
            *) echo "::error::Target no soportado: $TARGET"; exit 1 ;;
          esac
          if [ -z "$required_url" ]; then
            echo "::error::Falta la variable COOLIFY_${TARGET^^}_API_INTERNAL_URL."
            exit 1
          fi

      - name: Resolve image
        id: meta
        env:
          RESOLVED_SHA: ${{ needs.resolve.outputs.sha }}
          TARGET: ${{ needs.resolve.outputs.target }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-web"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image}:${RESOLVED_SHA}-${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Resolve labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.title=planb-web
            org.opencontainers.image.description=Frontend de planb, instrumento de presión estudiantil sobre universidades argentinas
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.INTERNAL_API_URL }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=planb-web-${{ needs.resolve.outputs.target }}
          cache-to: type=gha,scope=planb-web-${{ needs.resolve.outputs.target }},mode=max

  scan:
    name: Scan the images
    needs: [backend, frontend]
    if: always() && needs.backend.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy escanea CRITICAL y HIGH y nunca frena acá (exit-code 0): alimenta el summary y el
      # artifact de abajo, para que HIGH quede visible sin cortar cada merge por algo que a
      # veces no es explotable en el uso real de esta imagen. Los dos pasos del final repiten el
      # escaneo filtrando solo CRITICAL con exit-code 1: eso sí corta el job, porque ahí el
      # costo de ignorarlo es mayor que el de arreglarlo.
      - name: Scan planb-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.backend.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
          output: trivy-backend.txt

      - name: Scan planb-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.frontend.outputs.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
          output: trivy-frontend.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: |
            trivy-backend.txt
            trivy-frontend.txt
          retention-days: 14

      - name: Volcar el reporte al summary
        run: |
          {
            echo "## Trivy: planb-api"
            echo '```'
            cat trivy-backend.txt
            echo '```'
            echo "## Trivy: planb-web"
            echo '```'
            cat trivy-frontend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # El gate: mismo escaneo, filtrado a CRITICAL, con exit-code 1. El reporte de arriba
      # (CRITICAL y HIGH) ya quedó en el summary y el artifact aunque este paso corte el job.
      - name: Fail on critical vulnerabilities (planb-api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.backend.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Fail on critical vulnerabilities (planb-web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.frontend.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  deploy-stage:
    name: Deploy stage
    needs: [resolve, backend, frontend, scan, ci-gate]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.scan.result == 'success' &&
      needs.ci-gate.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-and-deploy' && inputs.target == 'stage'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_DEPLOY_TARGET: stage
      COOLIFY_MIGRATE_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_MIGRATE_SERVICE_UUID }}
      COOLIFY_API_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_API_SERVICE_UUID }}
      COOLIFY_WEB_SERVICE_UUID: ${{ vars.COOLIFY_STAGE_WEB_SERVICE_UUID }}
      COOLIFY_MIGRATE_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_MIGRATE_SERVICE_NAME }}
      COOLIFY_API_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_API_SERVICE_NAME }}
      COOLIFY_WEB_SERVICE_NAME: ${{ vars.COOLIFY_STAGE_WEB_SERVICE_NAME }}
      COOLIFY_API_IMAGE: ${{ needs.backend.outputs.image }}
      COOLIFY_WEB_IMAGE: ${{ needs.frontend.outputs.image }}
      COOLIFY_HEALTH_URL: https://planb.olisar.com.ar/health
      COOLIFY_WEB_URL: https://planb.olisar.com.ar
      COOLIFY_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
          # Un job que despliega no restaura caches: un cache envenenado podría cambiar el bun
          # que ejecuta el script de deploy (zizmor, cache-poisoning).
          no-cache: true

      - name: Deploy services
        run: bun scripts/deploy-coolify-services.ts

  deploy-production:
    name: Deploy production
    needs: [resolve, backend, frontend, scan, ci-gate]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.scan.result == 'success' &&
      needs.ci-gate.result == 'success' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-and-deploy' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_DEPLOY_TARGET: production
      COOLIFY_MIGRATE_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_MIGRATE_SERVICE_UUID }}
      COOLIFY_API_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_API_SERVICE_UUID }}
      COOLIFY_WEB_SERVICE_UUID: ${{ vars.COOLIFY_PRODUCTION_WEB_SERVICE_UUID }}
      COOLIFY_MIGRATE_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_MIGRATE_SERVICE_NAME }}
      COOLIFY_API_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_API_SERVICE_NAME }}
      COOLIFY_WEB_SERVICE_NAME: ${{ vars.COOLIFY_PRODUCTION_WEB_SERVICE_NAME }}
      COOLIFY_API_IMAGE: ${{ needs.backend.outputs.image }}
      COOLIFY_WEB_IMAGE: ${{ needs.frontend.outputs.image }}
      COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_PRODUCTION_HEALTH_URL }}
      COOLIFY_WEB_URL: ${{ vars.COOLIFY_PRODUCTION_WEB_URL }}
      COOLIFY_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
          # Un job que despliega no restaura caches: un cache envenenado podría cambiar el bun
          # que ejecuta el script de deploy (zizmor, cache-poisoning).
          no-cache: true

      - name: Deploy services
        run: bun scripts/deploy-coolify-services.ts
