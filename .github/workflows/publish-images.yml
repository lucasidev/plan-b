name: Publish images

# Se publica en cada push a main porque el stage sigue a main, y también a mano para
# cualquier ref (la corrida manual). El tag del sha es el inmutable; el tag main es
# el móvil que consume el stage.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch o tag a publicar'
        required: true
        default: 'main'
      component:
        description: 'Qué publicar'
        required: true
        default: 'both'
        type: choice
        options: [both, backend, frontend]
      api_url:
        description: 'URL del backend que el frontend hornea en el build; interna al compose del stage'
        required: true
        default: 'http://api:8080'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend image
    if: github.event_name == 'push' || inputs.component == 'both' || inputs.component == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse HEAD | cut -c1-7)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-api"
          tags="${image}:${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tags="${tags},${image}:main"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.title=planb-api
            org.opencontainers.image.description=API de planb, instrumento de presión estudiantil sobre universidades argentinas
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Frontend image
    if: github.event_name == 'push' || inputs.component == 'both' || inputs.component == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Resolve tags
        id: meta
        run: |
          sha="$(git rev-parse HEAD | cut -c1-7)"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/planb-web"
          tags="${image}:${sha}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tags="${tags},${image}:main"
          fi
          {
            echo "image=${image}"
            echo "tags=${tags}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve labels
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.title=planb-web
            org.opencontainers.image.description=Frontend de planb, instrumento de presión estudiantil sobre universidades argentinas
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          build-args: NEXT_PUBLIC_API_URL=${{ github.event_name == 'workflow_dispatch' && inputs.api_url || 'http://api:8080' }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Scan the images
    needs: [backend, frontend]
    if: always() && needs.backend.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy avisa (exit-code 0), no gatea: hasta ver dos corridas reales no hay piso de
      # severidad decidido para bloquear un merge por esto.
      - name: Scan planb-api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/planb-api:${{ needs.backend.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
          output: trivy-backend.txt

      - name: Scan planb-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/planb-web:${{ needs.frontend.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '0'
          output: trivy-frontend.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: |
            trivy-backend.txt
            trivy-frontend.txt
          retention-days: 14

      - name: Volcar el reporte al summary
        run: |
          {
            echo "## Trivy: planb-api"
            echo '```'
            cat trivy-backend.txt
            echo '```'
            echo "## Trivy: planb-web"
            echo '```'
            cat trivy-frontend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    name: Redeploy the stage
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGE_HEALTH_URL: https://planb.olisar.com.ar/health
    steps:
      # Va por la API de Dokploy, no por su Autodeploy: el Autodeploy dispara con el push
      # mismo, antes de que las imágenes existan en el registry.
      - id: deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_STAGE_COMPOSE_ID: ${{ secrets.DOKPLOY_STAGE_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_STAGE_COMPOSE_ID" ]; then
            echo "::notice::Las imágenes quedaron publicadas; el stage no se redespliega porque faltan los secrets de Dokploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "$DOKPLOY_URL/api/compose.deploy" -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" -d "{\"composeId\": \"$DOKPLOY_STAGE_COMPOSE_ID\"}"
          echo "El stage está redesplegando ${GITHUB_SHA:0:7}."
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # El deploy se verifica contra el sha que sirve el stage, no contra la
      # respuesta de Dokploy: esa solo confirma que encoló el redeploy.
      - name: Wait for the stage to run this sha
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          expected="${GITHUB_SHA:0:7}"
          code=""
          version=""
          status="sin respuesta"
          for _ in $(seq 1 30); do
            body="$(curl -s --max-time 10 -w '\n%{http_code}' "$STAGE_HEALTH_URL")"
            code="${body##*$'\n'}"
            json="${body%$'\n'*}"
            version="$(printf '%s' "$json" | jq -r '.version // empty' 2>/dev/null)"
            if [ "$code" = "200" ] && [ "$version" = "$expected" ]; then
              echo "El stage corre ${expected}."
              exit 0
            fi
            if [ "$code" = "000" ] || [ -z "$code" ]; then
              status="sin respuesta"
            else
              status="${code} ${version}"
            fi
            echo "El stage todavía no corre ${expected} (último /health: ${status})."
            sleep 10
          done
          echo "::error::El stage no llegó a ${expected} en 5 minutos (último /health: ${status})."
          exit 1

  # Recordatorio en el log de la corrida, no un paso automático. Aplicar el schema desde un runner
  # de GitHub exigiría exponer la base de producción a internet; el paso corre en el host del deploy.
  # Runbook: docs/engineering/deploy.md
  reminder:
    name: Siguiente paso
    needs: [backend]
    if: github.event_name == 'workflow_dispatch' && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Para el stage estos pasos no aplican: el api migra y siembra solo al arrancar (sección Stage de docs/engineering/deploy.md)."
          echo "Imagen publicada. Antes de levantar la versión nueva:"
          echo "  1. db-apply con la imagen recién publicada (migraciones EF + schema de Wolverine)"
          echo "  2. recién ahí, apuntar el servicio a la imagen nueva"
          echo "Pasos exactos en docs/engineering/deploy.md"
