name: Docs

# Verifica que los links en archivos markdown del repo no estén rotos.
# Tenemos ~40 docs entre ADRs, user-stories, epics, CLAUDE.md y conventions
# con cross-refs entre sí; cuando un archivo se renombra (ej. ADR-0037
# release-please → auto-append) los links viejos quedan colgados sin que
# nadie se entere hasta que alguien los clickea.
#
# Lychee chequea links relativos (entre archivos) y absolutos (HTTP).
# Configurado en `.github/lychee.toml`. Externos pueden flakear (rate
# limits, sitios caídos), por eso el workflow falla sólo en internos
# rotos por default; los externos quedan como warning.

on:
  pull_request:
    paths:
      - "**.md"
      # check-docs mira mas que markdown: los bocetos de pantalla son html y el
      # contrato de una pantalla exige que exista sketch.html.
      - "docs/**"
      - "scripts/check-docs.ts"
      - "scripts/lib/detect-language.ts"
      - ".github/lychee.toml"
      - ".github/workflows/docs-links.yml"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
      - "scripts/check-docs.ts"
      - "scripts/lib/detect-language.ts"
      - ".github/lychee.toml"

permissions:
  contents: read

# Evita runs paralelos sobre el mismo ref.
concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check links in markdown
    runs-on: ubuntu-latest
    # ~40 docs, externos cacheados. Run típico ≈ 30s. 5 min absorbe externos
    # lentos sin tolerar un hang del HTTP client de lychee.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore lychee cache
        # Cache de respuestas HTTP exitosas para no re-pegar a externos cada run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('.github/lychee.toml') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .github/lychee.toml --no-progress './**/*.md'
          fail: true

  # Job aparte del de lychee a proposito: lychee pega a URLs externas y puede
  # flakear; este es determinista y local. Separados, una flakeada de un link
  # externo no tapa la senal de este, y cada uno es un check context propio.
  coherence:
    name: Check docs coherence
    runs-on: ubuntu-latest
    # Run medido: ~1.5s sobre 230 docs. 3 min absorbe un checkout lento.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - name: Check docs coherence
        # --strict: aca corta. En pre-push senala y sigue, para no frenar un push
        # por un doc a medio escribir; el gate es el PR.
        run: bun scripts/check-docs.ts --strict
