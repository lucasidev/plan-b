# Config de zizmor (job "Workflows" en ci.yml). Un ignore acá es una decisión
# consciente, no un silenciador: cada regla lleva por qué el hallazgo no aplica.

rules:
  dangerous-triggers:
    ignore:
      # pull_request_target en dependabot-bun-lockfile.yml es intencional (ver el
      # header de ese workflow y ADR-0043): el job solo corre si el autor del PR
      # es dependabot[bot] (gate explícito, no un check de github.actor spoofeable),
      # nunca ejecuta código del PR más allá de `bun install` sobre su propio
      # package.json, y pushea con un token de GitHub App de vida corta, no con
      # un GITHUB_TOKEN con permisos elevados.
      - dependabot-bun-lockfile.yml
  unpinned-images:
    ignore:
      # Estos outputs solo contienen repositorios constantes con @sha256 validado
      # por dockerImage; si falla el selector, usan los tags explícitos anteriores.
      # El análisis estático no resuelve outputs. Se exceptúan solo estas seis
      # referencias; moverlas o agregar otro servicio requiere revisar la excepción.
      - ci.yml:162
      - ci.yml:180
      - ci.yml:197
      - ci.yml:369
      - ci.yml:380
      - ci.yml:388
